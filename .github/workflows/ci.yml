name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command make test

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make arch-docker
