[workspace]
resolver = "2"
members = [
    "crates/smkaf-core",
    "crates/gst-plugin-smkaf",
    "crates/smkaf-wasm",
    "crates/smkaf-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["streaMonkey GmbH"]
license = "MIT"
repository = "https://github.com/streamonkey/audiofilters"
publish = false

[workspace.dependencies]
smkaf-core = { path = "crates/smkaf-core" }

# Build for the WebAssembly module. Rust never applies value-changing float
# optimisations, so this does not affect parity with the native build.
# opt-level 3 instead of "s": ~15-20% faster coefficient updates while
# parameters move, for ~30 KB more module (`make bench` to compare).
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Keep the target_features section: wasm-opt reads it to know which wasm
# features (bulk memory, ...) the module uses. The npm build strips it.
strip = "debuginfo"
